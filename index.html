            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.1);
        }

        .radio-card:active {
            transform: scale(0.98);
        }

        .radio-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            background-color: #f0e2ed;
        }

        .radio-card h4 {

            color: #8e44ad;
            text-transform: uppercase;

            bottom: 0;
            left: 0;
            width: 100%;

            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);

    ];

    // 1. Generar todas las tarjetas dinámicamente
    const container = document.getElementById('radiosContainer');
    function generarTarjetas() {
        container.innerHTML = '';
        radios.forEach((radio, idx) => {
            const card = document.createElement('div');
            card.className = 'radio-card';
            card.setAttribute('data-id', idx);
            // imagen principal (podemos usar una imagen más variada, pero mantenemos la coherencia)
            const imgSrc = radio.cover;
            card.innerHTML = `
                <img src="${imgSrc}" alt="${radio.artist}" loading="lazy">
                <h4>${radio.name}</h4>
                <p>${radio.artist}</p>
            `;
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                ap.list.switch(idx);
                ap.play();
                // Aseguramos que el reproductor se muestre
                const playerDiv = document.getElementById('aplayer');
                if(playerDiv) playerDiv.style.bottom = '0px';
            });
            container.appendChild(card);
        });
    }

    // 2. Configurar APlayer con los datos del array
    const audioList = radios.map(radio => ({
        name: radio.name,
        artist: radio.artist,
        url: radio.url,
        cover: radio.cover
    }));

    const ap = new APlayer({
        container: document.getElementById('aplayer'),
        listFolded: false,
        audio: audioList
    });

    // 3. Inicializar la página
    generarTarjetas();

    // 4. Opcional: si el reproductor se oculta, forzar que se muestre al hacer clic
    // también podemos permitir que la lista se despliegue bien
    ap.on('play', function() {
        document.getElementById('aplayer').style.bottom = '0px';
    });

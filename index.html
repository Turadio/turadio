    // Generar tarjetas
    const container = document.getElementById('radiosContainer');
    function generarTarjetas() {
        container.innerHTML = '';
        radios.forEach((radio, idx) => {
            const card = document.createElement('div');
            card.className = 'radio-card';
            card.setAttribute('data-id', idx);
            card.innerHTML = `
                <img src="${radio.cover}" alt="${radio.artist}" loading="lazy">
                <h4>TURADIO</h4>
                <p>${radio.artist}</p>
            `;
            card.addEventListener('click', () => {
                ap.list.switch(idx);
                ap.play();
            });
            container.appendChild(card);
        });
    }

    // Configurar APlayer
    const audioList = radios.map(radio => ({
        name: radio.name,
        artist: radio.artist,
        url: radio.url,
        cover: radio.cover
    }));

    const ap = new APlayer({
        container: document.getElementById('aplayer'),
        listFolded: true,
        audio: audioList
    });

    generarTarjetas();
